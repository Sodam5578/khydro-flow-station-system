<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>로그인 | 한국수자원조사기술원 자동유량관측시설 관리시스템</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #0f172a 100%);
      padding: 1.5rem;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 0.88rem;
      color: #64748b;
      margin-top: 0.35rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">🌊</div>
      <div class="login-title">자동유량관측시설 관리시스템</div>
      <div class="login-subtitle">한국수자원조사기술원 수자원인프라팀</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label" style="font-weight:600; color:#334155;">사용자 아이디 (ID)</label>
        <input type="text" id="username" class="form-input" placeholder="아이디를 입력하세요" required style="padding:0.8rem 1rem; font-size:0.95rem;">
      </div>

      <div class="form-group" style="margin-bottom:1.75rem;">
        <label class="form-label" style="font-weight:600; color:#334155;">비밀번호 (Password)</label>
        <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required style="padding:0.8rem 1rem; font-size:0.95rem;">
      </div>

      <div id="login-error" style="display:none; color:#ef4444; font-size:0.85rem; margin-bottom:1.25rem; text-align:center; font-weight:600; background:#fef2f2; padding:0.6rem; border-radius:8px; border:1px solid #fee2e2;"></div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width:100%; padding:0.9rem; font-size:1.05rem; font-weight:700; border-radius:10px;">
        로그인
      </button>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.25rem; font-size:0.85rem;">
        <span style="color:#64748b;">비밀번호를 분실하셨나요?</span>
        <button type="button" onclick="openForgotModal()" style="background:none; border:none; color:#2563eb; font-weight:700; cursor:pointer; text-decoration:underline; font-size:0.85rem; padding:0;">
          🔑 비밀번호 찾기
        </button>
      </div>
    </form>

    <div style="margin-top:2rem; text-align:center; font-size:0.75rem; color:#94a3b8;">
      © 한국수자원조사기술원 수자원인프라팀 관제시스템
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgot-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.7); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center; padding:1rem; box-sizing:border-box;">
    <div style="background:#ffffff; border-radius:16px; width:100%; max-width:440px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); overflow:hidden;">
      <div style="padding:1.25rem 1.5rem; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between;">
        <div style="font-weight:800; font-size:1.1rem; color:#0f172a; display:flex; align-items:center; gap:0.5rem;">
          <span>🔐</span> <span>비밀번호 찾기 (임시 비밀번호 발급)</span>
        </div>
        <button onclick="closeForgotModal()" style="background:none; border:none; font-size:1.4rem; color:#94a3b8; cursor:pointer; line-height:1;">&times;</button>
      </div>

      <div style="padding:1.5rem;">
        <div style="font-size:0.86rem; color:#3b82f6; line-height:1.5; margin-bottom:1.25rem; background:#eff6ff; border:1px solid #dbeafe; padding:0.85rem 1rem; border-radius:8px;">
          💡 계정 아이디와 등록된 이메일 주소를 입력하시면 해당 메일로 <b>임시 비밀번호</b>가 안전하게 발송됩니다.
        </div>

        <form id="forgot-form" onsubmit="handleForgotPassword(event)">
          <div class="form-group" style="margin-bottom:1rem;">
            <label class="form-label" style="font-weight:600; color:#334155; font-size:0.88rem; display:block; margin-bottom:0.35rem;">사용자 아이디 (ID) *</label>
            <input type="text" id="forgot-username" class="form-input" placeholder="예: kihs01 또는 admin" required style="width:100%; padding:0.75rem 0.9rem; font-size:0.92rem; border:1px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
          </div>

          <div class="form-group" style="margin-bottom:1.25rem;">
            <label class="form-label" style="font-weight:600; color:#334155; font-size:0.88rem; display:block; margin-bottom:0.35rem;">등록된 이메일 주소 (Email) *</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="마이페이지에서 직접 등록한 이메일 주소 입력" required style="width:100%; padding:0.75rem 0.9rem; font-size:0.92rem; border:1px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
          </div>

          <div id="forgot-feedback" style="display:none; padding:0.75rem 0.9rem; border-radius:8px; font-size:0.84rem; font-weight:600; margin-bottom:1.25rem; line-height:1.5;"></div>

          <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
            <button type="button" class="btn" onclick="closeForgotModal()" style="padding:0.65rem 1.1rem; border:1px solid #cbd5e1; background:#ffffff; color:#475569; border-radius:8px; font-weight:600; cursor:pointer;">
              닫기
            </button>
            <button type="submit" id="btn-forgot-submit" class="btn btn-primary" style="padding:0.65rem 1.25rem; background:#2563eb; color:#ffffff; border:none; border-radius:8px; font-weight:700; cursor:pointer;">
              <span>📨</span> <span>임시 비밀번호 발송</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function openForgotModal() {
      const modal = document.getElementById("forgot-modal");
      if (modal) {
        modal.style.display = "flex";
        document.getElementById("forgot-feedback").style.display = "none";
        document.getElementById("forgot-form").reset();
      }
    }

    function closeForgotModal() {
      const modal = document.getElementById("forgot-modal");
      if (modal) modal.style.display = "none";
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const username = document.getElementById("forgot-username").value.trim();
      const email = document.getElementById("forgot-email").value.trim();
      const btn = document.getElementById("btn-forgot-submit");
      const fb = document.getElementById("forgot-feedback");

      btn.disabled = true;
      btn.innerHTML = `<span>⏳</span> <span>발송 처리 중...</span>`;
      fb.style.display = "none";

      try {
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email })
        });
        const data = await res.json();

        fb.style.display = "block";
        if (data.success) {
          fb.style.background = "#ecfdf5";
          fb.style.color = "#065f46";
          fb.style.border = "1px solid #a7f3d0";
          fb.innerHTML = `✓ <b>임시 비밀번호가 발송되었습니다!</b><br>${data.message}<br><span style="font-size:0.78rem; color:#047857; margin-top:4px; display:block;">(메일 확인 후 로그인 창에 임시 비밀번호를 입력해 로그인하세요.)</span>`;
          document.getElementById("forgot-form").reset();
        } else {
          fb.style.background = "#fef2f2";
          fb.style.color = "#991b1b";
          fb.style.border = "1px solid #fecaca";
          fb.innerHTML = `⚠️ ${data.message || "비밀번호 찾기 요청 실패"}`;
        }
      } catch (err) {
        fb.style.display = "block";
        fb.style.background = "#fef2f2";
        fb.style.color = "#991b1b";
        fb.style.border = "1px solid #fecaca";
        fb.innerHTML = `⚠️ 서버와 연결할 수 없습니다.`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>📨</span> <span>임시 비밀번호 발송</span>`;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = document.getElementById("btn-submit");
      const errEl = document.getElementById("login-error");

      btn.disabled = true;
      btn.textContent = "로그인 인증 중...";
      errEl.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem("khydro_auth_token", data.token);
          localStorage.setItem("khydro_user_profile", JSON.stringify(data.user));
          window.location.href = "index.html";
        } else {
          errEl.textContent = data.message || "아이디 또는 비밀번호가 올바르지 않습니다.";
          errEl.style.display = "block";
        }
      } catch (err) {
        console.error("Login fetch error:", err);
        errEl.textContent = "서버와 연결할 수 없습니다. (서버 상태 확인 필요)";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "로그인";
      }
    }

    // Auto redirect if already logged in
    (async function checkExistingAuth() {
      const token = localStorage.getItem("khydro_auth_token");
      if (token) {
        try {
          const res = await fetch("/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success) {
            window.location.href = "index.html";
          }
        } catch(e) {}
      }
    })();
  </script>
</body>
</html>
