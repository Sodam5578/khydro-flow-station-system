<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 한국수자원조사기술원 자동유량관측시설 관리시스템</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #0f172a 100%);
      padding: 1.5rem;
    }
    .login-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 1rem;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
    }
    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.25rem;
    }
    .demo-accounts {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #e2e8f0;
    }
    .demo-btn {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      background: #f1f5f9;
      color: #334155;
      border-radius: 6px;
      cursor: pointer;
      margin: 0.2rem;
      border: 1px solid #e2e8f0;
      transition: all 0.15s ease;
    }
    .demo-btn:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">🌊</div>
      <div class="login-title">자동유량관측시설 관리시스템</div>
      <div class="login-subtitle">한국수자원조사기술원 수자원인프라팀</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom:1.1rem;">
        <label class="form-label" style="font-weight:600;">아이디 (Username)</label>
        <input type="text" id="username" class="form-input" placeholder="아이디를 입력하세요" required style="padding:0.75rem 1rem;">
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label class="form-label" style="font-weight:600;">비밀번호 (Password)</label>
        <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required style="padding:0.75rem 1rem;">
      </div>

      <div id="login-error" style="display:none; color:#ef4444; font-size:0.85rem; margin-bottom:1rem; text-align:center; font-weight:600;"></div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:1rem; font-weight:700; border-radius:8px;">
        로그인
      </button>
    </form>

    <div class="demo-accounts">
      <div style="font-size:0.78rem; font-weight:700; color:#475569; margin-bottom:0.4rem;">💡 빠른 접속 계정 (클릭 시 자동 입력):</div>
      <div style="display:flex; flex-wrap:wrap;">
        <span class="demo-btn" onclick="fillDemo("admin", "admin1234")">🔑 최고관리자 (admin)</span>
        <span class="demo-btn" onclick="fillDemo("han_manager", "user1234")">🌊 한강담당 (han_manager)</span>
        <span class="demo-btn" onclick="fillDemo("nakdong_manager", "user1234")">🌊 낙동강담당 (nakdong)</span>
        <span class="demo-btn" onclick="fillDemo("geum_manager", "user1234")">🌊 금강담당 (geum)</span>
        <span class="demo-btn" onclick="fillDemo("yeongsan_manager", "user1234")">🌊 영산강담당 (yeongsan)</span>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(u, p) {
      document.getElementById("username").value = u;
      document.getElementById("password").value = p;
      document.getElementById("login-error").style.display = "none";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = document.getElementById("btn-submit");
      const errEl = document.getElementById("login-error");

      btn.disabled = true;
      btn.textContent = "로그인 중...";
      errEl.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem("khydro_auth_token", data.token);
          localStorage.setItem("khydro_user_profile", JSON.stringify(data.user));
          window.location.href = "index.html";
        } else {
          errEl.textContent = data.message || "로그인에 실패했습니다.";
          errEl.style.display = "block";
        }
      } catch (err) {
        console.error("Login fetch error:", err);
        errEl.textContent = "서버와 연결할 수 없습니다. (서버 구동 확인 필요)";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "로그인";
      }
    }

    // Auto redirect if already logged in
    (async function checkExistingAuth() {
      const token = localStorage.getItem("khydro_auth_token");
      if (token) {
        try {
          const res = await fetch("/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success) {
            window.location.href = "index.html";
          }
        } catch(e) {}
      }
    })();
  </script>
</body>
</html>
