<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>로그인 | 한국수자원조사기술원 자동유량관측시설 관리시스템</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #0f172a 100%);
      padding: 1.5rem;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 0.88rem;
      color: #64748b;
      margin-top: 0.35rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">🌊</div>
      <div class="login-title">자동유량관측시설 관리시스템</div>
      <div class="login-subtitle">한국수자원조사기술원 수자원인프라팀</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label" style="font-weight:600; color:#334155;">사용자 아이디 (ID)</label>
        <input type="text" id="username" class="form-input" placeholder="아이디를 입력하세요" required style="padding:0.8rem 1rem; font-size:0.95rem;">
      </div>

      <div class="form-group" style="margin-bottom:1.75rem;">
        <label class="form-label" style="font-weight:600; color:#334155;">비밀번호 (Password)</label>
        <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required style="padding:0.8rem 1rem; font-size:0.95rem;">
      </div>

      <div id="login-error" style="display:none; color:#ef4444; font-size:0.85rem; margin-bottom:1.25rem; text-align:center; font-weight:600; background:#fef2f2; padding:0.6rem; border-radius:8px; border:1px solid #fee2e2;"></div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width:100%; padding:0.9rem; font-size:1.05rem; font-weight:700; border-radius:10px;">
        로그인
      </button>
    </form>

    <div style="margin-top:2rem; text-align:center; font-size:0.75rem; color:#94a3b8;">
      © 한국수자원조사기술원 수자원인프라팀 관제시스템
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = document.getElementById("btn-submit");
      const errEl = document.getElementById("login-error");

      btn.disabled = true;
      btn.textContent = "로그인 인증 중...";
      errEl.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem("khydro_auth_token", data.token);
          localStorage.setItem("khydro_user_profile", JSON.stringify(data.user));
          window.location.href = "index.html";
        } else {
          errEl.textContent = data.message || "아이디 또는 비밀번호가 올바르지 않습니다.";
          errEl.style.display = "block";
        }
      } catch (err) {
        console.error("Login fetch error:", err);
        errEl.textContent = "서버와 연결할 수 없습니다. (서버 상태 확인 필요)";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "로그인";
      }
    }

    // Auto redirect if already logged in
    (async function checkExistingAuth() {
      const token = localStorage.getItem("khydro_auth_token");
      if (token) {
        try {
          const res = await fetch("/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.success) {
            window.location.href = "index.html";
          }
        } catch(e) {}
      }
    })();
  </script>
</body>
</html>
